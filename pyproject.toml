[tool.poetry]
name = "Distillflow"
version = "0.2.0"
description = ""
authors = ["Horus Labs <hello@horusailabs.com>"]
readme = "README.rst"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
setuptools = ">=75.0"
accelerate = ">=1.2"
datasets = ">=3.0"
evaluate = ">=0.4"
huggingface-hub = ">=0.26"
numpy = ">=2.0"
pandas = ">=2.2"
pydantic = ">=2.7"
pyyaml = ">=6.0"
safetensors = ">=0.4"
tokenizers = ">=0.20"
torch = ">=2.5"
tqdm = ">=4.66"
transformers = ">=4.50"
trl = ">=0.13"
peft = ">=0.14"
runpod = ">=1.7"
bitsandbytes = { version = ">=0.44", markers = "sys_platform == 'linux'" }
unsloth = { version = ">=2024.11", markers = "sys_platform == 'linux'" }
liger-kernel = { version = ">=0.5", markers = "sys_platform == 'linux'" }
triton = { version = ">=3.0", markers = "sys_platform == 'linux'" }
deepspeed = { version = ">=0.15", markers = "sys_platform == 'linux'" }
boto3 = ">=1.35"
google-cloud-compute = ">=1.23"
config = ">=0.5"
tiktoken = ">=0.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
flake8 = ">=7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
in-project = true
